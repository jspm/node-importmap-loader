name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Node.js 26
        uses: actions/setup-node@v3
        with:
          node-version: 26.x

      - name: Setup Chomp
        uses: guybedford/chomp-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: chomp build

      - name: Lint
        run: chomp lint

      - name: Check formatting
        run: chomp format:check

      - name: Run tests
        run: chomp test
        env:
          CI: true

      - name: Upload compiled tests
        uses: actions/upload-artifact@v4
        with:
          name: compiled-tests
          path: dist

  runtime:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --omit=dev --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: compiled-tests
          path: dist
      - run: node --test dist/tests/*.test.js tests/e2e/test.js
