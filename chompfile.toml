version = 0.1

default-task = 'build'

[[task]]
name = 'setup'
dep = 'prepare'

[[task]]
name = 'build'
run = 'tsup src/loader.ts --format esm --target node22 --dts'
deps = ['npm:install', 'src/**/*.ts']
targets = ['dist/loader.js', 'dist/loader.d.ts']

[[task]]
name = 'npm:install'
run = 'npm ci --ignore-scripts'
deps = ['package.json', 'package-lock.json']
target = 'node_modules/.package-lock.json'

[[task]]
name = 'clean'
run = 'rm -rf dist'

[[task]]
name = 'format'
run = 'npm run format'
dep = 'npm:install'

[[task]]
name = 'format:check'
run = 'npm run format:check'
dep = 'npm:install'

[[task]]
name = 'lint'
run = 'npm run lint'
dep = 'npm:install'

[[task]]
name = 'lint:fix'
run = 'npm run lint:fix'
dep = 'npm:install'

[[task]]
name = 'post-merge'
deps = ['npm:install', 'build']

[[task]]
name = 'pre-commit'
deps = ['typecheck', 'test:changed', 'lint', 'format:check']

[[task]]
name = 'prepare'
run = 'npm run hooks:install'
dep = 'npm:install'

[[task]]
name = 'prepublishOnly'
deps = ['test', 'build']

[[task]]
name = 'server'
deps = ['server:build', 'server:start']

[[task]]
name = 'server:build'
dep = 'build'

[[task]]
name = 'server:start'
dep = 'build'
run = '''
echo "Starting server..."
node --loader ./dist/loader.js tests/e2e/test-server.js
echo "Server started."
'''

[[task]]
name = 'test'
deps = ['test:unit', 'test:e2e']

[[task]]
name = 'test:e2e'
run = 'node --test tests/e2e/test.js'
deps = ['build']

[[task]]
name = 'test:build'
run = 'tsup tests/*.test.ts --format esm --target node22 --out-dir dist/tests --clean --no-splitting'
deps = ['npm:install', 'chompfile.toml', 'tsconfig.json', 'src/**/*.ts', 'tests', 'tests/**/*.ts']
target = 'dist/tests'

[[task]]
name = 'test:unit'
run = 'node --test dist/tests/*.test.js'
dep = 'test:build'

[[task]]
name = 'test:changed'
dep = 'test:unit'

[[task]]
name = 'typecheck'
run = 'tsc --project tsconfig.test.json'
dep = 'npm:install'

[[task]]
name = 'dir-size'
run = 'du -hs .cache'
