version = 0.1

default-task = 'build'

[[task]]
name = 'build'
run = 'tsup src/loader.ts --format esm --target node22 --dts'
dep = 'src/#.ts'
target = 'dist/loader.js'

[[task]]
name = 'npm:install'
run = 'npm install'
dep = 'package.json'
target = 'package-lock.json'

[[task]]
name = 'clean'
run = 'rm -rf dist'

[[task]]
name = 'format'
run = 'npm run format'

[[task]]
name = 'format:check'
run = 'npm run format:check'

[[task]]
name = 'lint'
run = 'npm run lint'

[[task]]
name = 'lint:fix'
run = 'npm run lint:fix'

[[task]]
name = 'post-merge'
deps = ['npm:install', 'build']

[[task]]
name = 'pre-commit'
deps = ['typecheck', 'test:changed', 'lint', 'format:check']

[[task]]
name = 'prepare'
run = 'npm run hooks:install'

[[task]]
name = 'prepublishOnly'
deps = ['test', 'build']

[[task]]
name = 'server'
deps = ['server:build', 'server:start']

[[task]]
name = 'server:build'
run = "echo 'Building...' && chomp build && echo 'Build complete.'"

[[task]]
name = 'server:start'
run = '''
echo "Starting server..."
node --loader ./dist/loader.js tests/e2e/test-server.js
echo "Server started."
'''

[[task]]
name = 'test'
deps = ['test:unit', 'test:e2e']

[[task]]
name = 'test:e2e'
run = 'node --test tests/e2e/test.js'
deps = ['build']

[[task]]
name = 'test:unit'
run = 'npm run test:unit'

[[task]]
name = 'test:changed'
run = 'npm run test:unit'

[[task]]
name = 'typecheck'
run = 'tsc --noEmit'

[[task]]
name = 'dir-size'
run = 'du -hs .cache'
