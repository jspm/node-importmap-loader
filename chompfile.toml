version = 0.1

default-task = 'build'

[env]
NODE_VERSION = '26.13.0'

[[task]]
name = 'node:install'
run = 'sh scripts/setup-node.sh'
deps = ['scripts/setup-node.sh', 'chompfile.toml']
targets = ['.bin/node', '.bin/npm']

[[task]]
name = 'node:version'
run = 'node --version'
dep = 'node:install'

[[task]]
name = 'setup'
dep = 'npm:install'

[[task]]
name = 'build'
run = 'tsup src/loader.ts --format esm --target node22 --dts'
deps = ['npm:install', 'src/**/*.ts']
targets = ['dist/loader.js', 'dist/loader.d.ts']

[[task]]
name = 'npm:install'
run = 'npm ci --ignore-scripts'
deps = ['node:install', 'package.json', 'package-lock.json']
target = 'node_modules/.package-lock.json'

[[task]]
name = 'clean'
run = 'rm -rf dist'

[[task]]
name = 'format'
run = 'npm run format'
dep = 'npm:install'

[[task]]
name = 'format:check'
run = 'npm run format:check'
dep = 'npm:install'

[[task]]
name = 'lint'
run = 'npm run lint'
dep = 'npm:install'

[[task]]
name = 'lint:fix'
run = 'npm run lint:fix'
dep = 'npm:install'

[[task]]
name = 'post-merge'
deps = ['npm:install', 'build']

[[task]]
name = 'pre-commit'
deps = ['typecheck', 'test:changed', 'lint', 'format:check']

[[task]]
name = 'prepare'
run = 'npm run hooks:install'
dep = 'npm:install'

[[task]]
name = 'prepublishOnly'
deps = ['test', 'build']

[[task]]
name = 'server'
deps = ['server:build', 'server:start']

[[task]]
name = 'server:build'
dep = 'build'

[[task]]
name = 'server:start'
dep = 'build'
run = '''
echo "Starting server..."
node --loader ./dist/loader.js tests/e2e/test-server.js
echo "Server started."
'''

[[task]]
name = 'test'
deps = ['test:unit', 'test:e2e']

[[task]]
name = 'test:e2e'
run = 'node --test tests/e2e/test.js'
deps = ['build']

[[task]]
name = 'test:unit'
run = 'npm run test:unit'
dep = 'npm:install'

[[task]]
name = 'test:changed'
run = 'npm run test:unit'
dep = 'npm:install'

[[task]]
name = 'typecheck'
run = 'tsc --noEmit'
dep = 'npm:install'

[[task]]
name = 'dir-size'
run = 'du -hs .cache'
